name: Build CHAUSONHAI APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - run: gradle :app:assembleDebug --stacktrace
      - run: mv app/build/outputs/apk/debug/app-debug.apk CHAUSONHAI.apk
      - uses: actions/upload-artifact@v4
        with: { name: CHAUSONHAI-apk, path: CHAUSONHAI.apk }
